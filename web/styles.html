<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The styles · Designed Living</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; margin-bottom: 28px; }
  .top h1 { margin: 0; font-weight: 300; font-size: clamp(34px, 5vw, 52px); line-height: 1.08; }
  .top p { margin: 10px 0 0; color: var(--ink-dim); font-size: 17px; max-width: 640px; }
  .scope { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .chips button { border-radius: 999px; padding: 7px 14px; min-height: 36px; font-size: 13.5px; }
  .chips button[aria-pressed=true] { border-color: var(--brass); background: rgba(209, 169, 101, .16); }
  #scope-line { font-size: 14px; color: var(--ink-dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
  .style { text-align: left; display: block; padding: 12px 12px 18px; border-radius: 20px; background: linear-gradient(180deg, rgba(31, 28, 24, .95), rgba(20, 18, 16, .95)); border: 1px solid var(--line);
    color: var(--ink); font-weight: 400; transition: transform .3s cubic-bezier(.2, .7, .2, 1), border-color .25s, box-shadow .3s; min-height: 0; box-shadow: var(--shadow); }
  .style { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; }
  .style > * { flex: none; }
  .style:hover:not(:disabled) { background: linear-gradient(180deg, rgba(36, 32, 27, .95), rgba(22, 20, 17, .95)); }
  .style:hover { transform: translateY(-4px); border-color: var(--line-2); }
  .style[aria-pressed=true] { border-color: rgba(212, 171, 102, .75); box-shadow: 0 0 0 1px rgba(212, 171, 102, .35), 0 20px 50px -24px var(--brass-glow), var(--shadow); }
  .vignette { position: relative; height: 190px; border-radius: 14px; overflow: hidden; }
  .vignette div { position: absolute; }
  .vignette { box-shadow: 0 0 0 1px var(--line); }
  .vignette.photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1s cubic-bezier(.2, .7, .2, 1); }
  .style:hover .vignette.photo img { transform: scale(1.05); }
  .vignette.photo span { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; font-size: 12px; color: var(--ink); background: linear-gradient(transparent, rgba(8, 7, 6, .85)); }
  .chipsw { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 12px; }
  .chipsw span { flex: 1; }
  .name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 14px; }
  .name b { font-family: var(--serif); font-size: 23px; font-weight: 400; }
  .name i { font-style: normal; font-size: 12px; font-weight: 600; color: #12110f; background: var(--brass); padding: 3px 9px; border-radius: 999px; }
  .looks { color: #cfc4b2; font-size: 14.5px; margin-top: 6px; }
  .materials { color: var(--ink-dim); font-size: 13px; margin-top: 8px; }
  .best { color: var(--brass); font-size: 13px; margin-top: 8px; }
  .foot { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
  @media (max-width: 760px) { .scope { align-items: flex-start; } .chips { justify-content: flex-start; } }
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="index.html">Designed <b>Living</b></a>
  <div class="right"><a class="btn" id="back" href="index.html">My houses</a><a class="btn" href="settings.html">Settings</a></div>
</header>
<main class="wrap">
  <div class="top">
    <div>
      <h1 id="h">The styles</h1>
      <p id="lead">Each style is a set of real, named materials: walls, floor, fabric, wood, metal and one accent. The little room on each card is drawn in its colours.</p>
    </div>
    <div class="scope" id="scope" hidden>
      <div class="chips" id="chips" role="group" aria-label="Choose the style for"></div>
      <div id="scope-line" role="status"></div>
    </div>
  </div>
  <p id="msg" class="bad" role="status"></p>
  <div class="grid" id="grid"></div>
  <div class="foot" id="foot" hidden>
    <a class="btn" id="to-house" href="#">Back to the house</a>
    <a class="btn go" id="to-design" href="#">Design the rooms</a>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
async function call(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'Designed Living did not answer. Is its window still open?' }));
  if (!r.ok) throw new Error(j.error || `Error ${r.status}`);
  return j;
}
const id = decodeURIComponent(location.hash.slice(1));
let styles = [], shots = [], house = null, design = null, scope = '';      // scope: '' = the whole house, else a room's name

function colour(pal, use, fallback) { const p = pal.find(p => p.use === use); return p ? p.hex : fallback; }
function vignette(pal) {
  const walls = colour(pal, 'walls', '#efe7da'), floor = colour(pal, 'floor', colour(pal, 'stone', '#b48d63'));
  const fabric = colour(pal, 'fabric', '#d9cfbf'), accent = colour(pal, 'accent', colour(pal, 'stone', '#8fa596'));
  const wood = colour(pal, 'wood', '#8a6a4c'), metal = colour(pal, 'metal', '#2a2826');
  const v = el('div', { class: 'vignette', 'aria-hidden': 'true' });
  const part = css => { const d = el('div'); d.style.cssText = css; v.append(d); };
  part(`left:0;right:0;top:0;height:64%;background:${walls}`);
  part(`left:0;right:0;bottom:0;height:36%;background:repeating-linear-gradient(90deg,${floor} 0 38px,rgba(0,0,0,.12) 38px 39px)`);
  part(`left:38%;top:14%;width:22%;height:27%;background:${accent};box-shadow:0 0 0 4px ${wood}`);
  part(`left:22%;bottom:26%;width:54%;height:22%;border-radius:8px 8px 3px 3px;background:${fabric};box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)`);
  part(`left:30%;bottom:38%;width:12%;height:10%;border-radius:4px;background:${accent}`);
  part(`left:36%;bottom:10%;width:26%;height:8%;border-radius:3px;background:${wood}`);
  part(`left:85%;bottom:26%;width:2px;height:40%;background:${metal}`);
  part(`left:80%;top:20%;width:12%;height:12%;border-radius:4px 4px 0 0;background:${metal};opacity:.9`);
  return v;
}
const nameOf = key => (styles.find(s => s.key === key) || {}).name || key;
function current() {
  if (!design) return null;
  if (!scope) return design.style;
  return ((design.rooms || {})[scope] || {}).style || design.style;
}

function draw() {
  const now = current();
  const grid = $('grid'); grid.replaceChildren();
  for (const s of styles) {
    const b = el('button', { type: 'button', class: 'style', 'aria-pressed': String(s.key === now) });
    const shot = shots.find(g => g.style === s.key && (!house || g.id === id)) || shots.find(g => g.style === s.key);
    if (shot) {                                    // a real room you designed in this style, else the drawn room
      const f = el('div', { class: 'vignette photo' });
      f.append(el('img', { src: `/api/photo?id=${encodeURIComponent(shot.id)}&room=${encodeURIComponent(shot.room)}&t=${encodeURIComponent(shot.made)}`, alt: '', loading: 'lazy' }), el('span', {}, `${shot.room} · ${shot.title}`));
      b.append(f);
    } else b.append(vignette(s.palette));
    const sw = el('div', { class: 'chipsw', 'aria-hidden': 'true' }); for (const p of s.palette) { const c = el('span', { title: p.name }); c.style.background = p.hex; sw.append(c); } b.append(sw);
    const n = el('div', { class: 'name' }); n.append(el('b', {}, s.name)); if (s.key === now) n.append(el('i', {}, 'Chosen')); b.append(n);
    b.append(el('div', { class: 'looks' }, s.looks));
    b.append(el('div', { class: 'materials' }, s.palette.map(p => p.name).join(', ')));
    b.append(el('div', { class: 'best' }, 'Best for: ' + s.best));
    if (house) b.onclick = () => pick(s.key);
    else b.onclick = () => { $('msg').className = 'facts'; $('msg').textContent = 'Open a house first (My houses), then pick its style from there.'; };
    grid.append(b);
  }
  if (house) {
    const chips = $('chips'); chips.replaceChildren();
    for (const [key, label] of [['', 'Whole house'], ...(house.rooms || []).map(r => [r.name, r.name])]) {
      const c = el('button', { type: 'button', 'aria-pressed': String(key === scope) }, label);
      c.onclick = () => { scope = key; draw(); };
      chips.append(c);
    }
    const own = scope && ((design.rooms || {})[scope] || {}).style;
    $('scope-line').textContent = scope ? `${scope}: ${nameOf(now)}${own ? '' : ' (same as the house)'}` : `Whole house: ${nameOf(design.style)}`;
  }
}

function take(v) {
  house = v.house;
  design = { rooms: {}, ...(v.house.design || {}) };
  design.style = design.style || (v.design || {}).style;
}

async function pick(key) {
  $('msg').textContent = '';
  const changes = scope ? { room_style: { [scope]: key === design.style ? '' : key } } : { style: key };
  try {
    const v = await call('/api/house', { action: 'save', id, design: changes });
    take(v);
    draw();
  } catch (err) { $('msg').className = 'bad'; $('msg').textContent = err.message; }
}

(async () => {
  try { const r = await call('/api/styles'); styles = r.styles; } catch (err) { $('msg').textContent = err.message; return; }
  try { shots = (await call('/api/gallery')).photos || []; } catch (e) {}
  if (id) {
    try {
      const v = await call('/api/house?id=' + encodeURIComponent(id));
      take(v);
      $('h').textContent = `Choose a look for ${house.title}`;
      $('lead').textContent = 'Pick one for the whole house, then change any room on its own: a spa bathroom, a playful kids\' room. Nothing is made until you design the rooms, so trying styles is free.';
      $('scope').hidden = false; $('foot').hidden = false;
      $('back').href = $('to-house').href = 'house.html#' + encodeURIComponent(id);
      $('to-design').href = 'house.html#' + encodeURIComponent(id);
      $('to-design').onclick = () => { try { sessionStorage.setItem('dl-scroll', 'design'); } catch (e) {} };
    } catch (err) { $('msg').textContent = err.message; }
  }
  draw();
})();
</script>
</body>
</html>
